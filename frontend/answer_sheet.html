<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โครงสร้างกระดาษคำตอบ (OMR Answer Sheet)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Sarabun', sans-serif;
            background: #d1d5db;
        }

        /* คอลัมน์จุดฝน OMR */
        .omr-columns-2 {
            column-count: 2;
            column-gap: 2rem;
        }

        .omr-columns-4 {
            column-count: 4;
            column-gap: 1.2rem;
        }

        /* =========================================
           ขนาด A4 พิมพ์จริง
        ========================================= */
        @page {
            size: A4;
            margin: 0;
        }

        @media print {
            body {
                background: white;
                margin: 0;
                padding: 0;
            }

            .no-print {
                display: none !important;
            }

            .sheet-preview-wrapper {
                padding: 0 !important;
                background: white !important;
            }

            .answer-sheet {
                box-shadow: none !important;
                margin: 0 !important;
                width: 210mm !important;
                height: 297mm !important;
            }
        }

        /* =========================================
           กระดาษคำตอบ
        ========================================= */
        .answer-sheet {
            width: 210mm;
            height: 297mm;
            background: white;
            position: relative;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* จุดมุม (Alignment Marks) — ขนาด 10mm × 10mm */
        .mark-corner {
            position: absolute;
            width: 10mm;
            height: 10mm;
            background: black;
            z-index: 10;
        }

        .mark-tl {
            top: 6mm;
            left: 6mm;
        }

        .mark-tr {
            top: 6mm;
            right: 6mm;
        }

        .mark-bl {
            bottom: 6mm;
            left: 6mm;
        }

        .mark-br {
            bottom: 6mm;
            right: 6mm;
        }

        /* บาร์โค้ด — อยู่กึ่งกลางด้านล่าง */
        .barcode-area {
            position: absolute;
            bottom: 6mm;
            left: 50%;
            transform: translateX(-50%);
            height: 10mm;
            display: flex;
            align-items: stretch;
            gap: 2mm;
            z-index: 10;
        }

        /* เนื้อหากระดาษ — padding ปลอดภัยห่างจากจุดมาร์คและบาร์โค้ด
           บน: 22mm (6mm mark + 10mm mark + 6mm gap)
           ล่าง: 28mm (6mm mark + 10mm mark + 12mm gap กัน barcode area)
           ซ้าย/ขวา: 22mm */
        .sheet-content {
            position: absolute;
            top: 22mm;
            bottom: 28mm;
            left: 22mm;
            right: 22mm;
            display: flex;
            flex-direction: column;
        }

        /* ส่วนหัวกระดาษ */
        .sheet-header {
            flex-shrink: 0;
        }

        /* ส่วนช่องฝนคำตอบ — เต็มพื้นที่ที่เหลือ */
        .sheet-bubbles {
            flex: 1;
            min-height: 0;
            border: 2px solid black;
            padding: 4px 6px;
            overflow: hidden;
        }
    </style>
</head>

<body>

    <!-- ============================================================
         แถบควบคุม (จะซ่อนเมื่อพิมพ์)
    ============================================================ -->
    <div id="sheetToolbar"
        class="no-print bg-white shadow-md py-3 px-6 flex flex-wrap gap-3 items-center sticky top-0 z-50">
        <div class="flex items-center gap-2 mr-4">
            <div class="w-8 h-8 flex items-center justify-center">
                <svg viewBox="0 0 100 100" class="w-7 h-7">
                    <!-- Board -->
                    <rect x="25" y="15" width="50" height="70" rx="6" fill="white" stroke="#1E293B" stroke-width="2" />
                    <rect x="38" y="10" width="24" height="8" rx="2" fill="#475569" />

                    <!-- Checkboxes -->
                    <circle cx="38" cy="35" r="3" fill="#3B82F6" />
                    <rect x="46" y="34" width="20" height="2" rx="1" fill="#E2E8F0" />

                    <circle cx="38" cy="50" r="3" fill="#3B82F6" />
                    <rect x="46" y="49" width="20" height="2" rx="1" fill="#E2E8F0" />

                    <circle cx="38" cy="65" r="3" fill="#3B82F6" />
                    <rect x="46" y="64" width="20" height="2" rx="1" fill="#E2E8F0" />

                    <!-- Pencil -->
                    <g transform="translate(68, 15) rotate(45)">
                        <rect x="0" y="0" width="5" height="18" fill="#FBBF24" />
                        <rect x="0" y="0" width="5" height="3.5" fill="#EF4444" /> <!-- Eraser -->
                        <path d="M0 18 L2.5 24 L5 18 Z" fill="#D1D5DB" /> <!-- Tip -->
                    </g>

                    <!-- Success Circle -->
                    <circle cx="82" cy="82" r="14" fill="#10B981" stroke="white" stroke-width="1.5" />
                    <path d="M76 82 L80 86 L88 78" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </div>
            <span class="font-bold text-gray-800">ออกแบบกระดาษคำตอบ</span>
        </div>

        <!-- ตัวเลือกจำนวนข้อ -->
        <div class="flex items-center gap-2">
            <label class="text-sm font-semibold text-gray-600">จำนวนข้อ:</label>
            <input type="number" id="ctrlQuestions" value="50" min="1" max="100"
                class="border rounded px-2 py-1 w-20 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>

        <!-- ตัวเลือกจำนวนตัวเลือก -->
        <div class="flex items-center gap-2">
            <label class="text-sm font-semibold text-gray-600">ตัวเลือก:</label>
            <select id="ctrlOptions"
                class="border rounded px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white">
                <option value="4">4 (A-D)</option>
                <option value="5">5 (A-E)</option>
            </select>
        </div>

        <!-- ชุดข้อสอบ (ซ่อนไว้ให้เหลือชุดเดียว) -->
        <div class="hidden">
            <label class="text-sm font-semibold text-gray-600">ชุดข้อสอบ:</label>
            <input type="number" id="ctrlSets" value="1" min="1" max="10"
                class="border rounded px-2 py-1 w-16 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>

        <!-- ชื่อวิชา -->
        <div class="flex items-center gap-2">
            <label class="text-sm font-semibold text-gray-600">วิชา:</label>
            <input type="text" id="ctrlSubject" value="INT101" placeholder="รหัสวิชา"
                class="border rounded px-2 py-1 w-28 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>

        <!-- ชื่อข้อสอบ -->
        <div class="flex items-center gap-2">
            <label class="text-sm font-semibold text-gray-600">ชื่อข้อสอบ:</label>
            <input type="text" id="ctrlExamName" value="สอบกลางภาค" placeholder="ชื่อข้อสอบ"
                class="border rounded px-2 py-1 w-36 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>

        <button onclick="renderSheet()"
            class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded font-bold text-sm transition">
            <i class="fa-solid fa-sync mr-1"></i> สร้างกระดาษ
        </button>
        <button onclick="window.print()"
            class="bg-gray-700 hover:bg-gray-800 text-white px-4 py-1.5 rounded font-bold text-sm transition">
            <i class="fa-solid fa-print mr-1"></i> พิมพ์
        </button>
    </div>

    <!-- ============================================================
         พื้นที่แสดงกระดาษคำตอบ
    ============================================================ -->
    <div class="sheet-preview-wrapper flex justify-center py-8 px-4">
        <div class="answer-sheet shadow-2xl" id="answerSheet">

            <!-- จุดมุมทั้งสี่ (Alignment Corner Marks) -->
            <div class="mark-corner mark-tl"></div>
            <div class="mark-corner mark-tr"></div>
            <div class="mark-corner mark-bl"></div>
            <div class="mark-corner mark-br"></div>

            <!-- บาร์โค้ดระบุประเภทกระดาษ -->
            <div class="barcode-area" id="sheetBarcode"></div>

            <!-- เนื้อหากระดาษ (ห่างจากจุดมาร์คและบาร์โค้ด) -->
            <div class="sheet-content">

                <!-- หัวกระดาษ -->
                <div class="sheet-header">
                    <div class="text-center mb-2">
                        <h2 class="text-2xl font-bold tracking-[0.2em] text-gray-800">ANSWER SHEET</h2>
                    </div>

                    <div class="flex justify-between items-start p-2 mb-3 border-b border-gray-300 gap-4">

                        <!-- ข้อมูลข้อสอบ / ผู้สอบ -->
                        <div class="space-y-2 w-1/2 text-xs font-semibold pr-3">
                            <div class="flex items-end gap-1">
                                <span class="w-20 shrink-0">Subject:</span>
                                <span id="sheetSubject"
                                    class="flex-1 border-b border-black text-blue-700 font-bold px-1 whitespace-nowrap overflow-hidden"></span>
                            </div>
                            <div class="flex items-end gap-1">
                                <span class="w-20 shrink-0">Exam Name:</span>
                                <span id="sheetExamName"
                                    class="flex-1 border-b border-black text-blue-700 font-bold px-1 whitespace-nowrap overflow-hidden"></span>
                            </div>
                            <div class="flex items-end gap-1">
                                <span class="w-20 shrink-0">Class:</span>
                                <span class="flex-1 border-b border-black">&nbsp;</span>
                            </div>
                            <div class="flex items-end gap-1">
                                <span class="w-20 shrink-0">Name:</span>
                                <span class="flex-1 border-b border-black">&nbsp;</span>
                            </div>
                        </div>

                        <!-- ชุดข้อสอบ + รหัสนักเรียน -->
                        <div class="w-1/2 flex justify-end gap-4 pl-3 border-l border-gray-300">

                            <!-- Set Bubbles -->
                            <div id="sheetVersionContainer" class="text-center hidden">
                                <p class="text-[10px] font-bold mb-1">Set / ชุด</p>
                                <div class="border border-black p-1 bg-gray-50 flex flex-col gap-0.5 items-center"
                                    id="sheetVersionBubbles"></div>
                            </div>

                            <!-- Student ID Grid -->
                            <div class="text-center">
                                <p class="text-[10px] font-bold mb-1">Student ID / รหัสนักเรียน</p>
                                <div class="border border-black p-1 bg-gray-50">
                                    <div class="flex gap-[2px]" id="sheetStudentIdGrid"></div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
                <!-- /sheet-header -->

                <!-- ช่องฝนคำตอบ -->
                <div class="sheet-bubbles" id="sheetBubbles"></div>

            </div>
            <!-- /sheet-content -->

        </div>
    </div>

    <script>
        // ============================================================
        // renderSheet() — วาดกระดาษคำตอบตาม config ที่เลือก
        // รับ config object โดยตรง หรืออ่านจาก controls ถ้าไม่มี
        // ============================================================
        function renderSheet(cfg) {
            const numQ = cfg ? cfg.questions : (parseInt(document.getElementById('ctrlQuestions').value) || 50);
            const numOpts = cfg ? cfg.options : (parseInt(document.getElementById('ctrlOptions').value) || 4);
            const numSets = 1; // บังคับให้มีแค่ชุดเดียวตามคำขอของผู้ใช้
            const subject = cfg ? cfg.subject : document.getElementById('ctrlSubject').value.trim();
            const examName = cfg ? cfg.examName : document.getElementById('ctrlExamName').value.trim();

            // sync controls ให้ตรงกับค่าที่ได้รับ
            if (cfg) {
                document.getElementById('ctrlQuestions').value = numQ;
                document.getElementById('ctrlOptions').value = numOpts;
                document.getElementById('ctrlSets').value = numSets;
                document.getElementById('ctrlSubject').value = subject;
                document.getElementById('ctrlExamName').value = examName;
            }

            // ข้อมูลหัวกระดาษ
            document.getElementById('sheetSubject').innerText = subject;
            document.getElementById('sheetExamName').innerText = examName;

            // ——— ตาราง Student ID (13 หลัก) ———
            let sidHTML = '';
            for (let i = 0; i < 13; i++) {
                sidHTML += `<div class="flex flex-col items-center">
                    <div class="border border-gray-400 w-3 h-3 mb-0.5 bg-white"></div>`;
                for (let j = 0; j <= 9; j++) {
                    sidHTML += `<div class="w-[10px] h-[10px] rounded-full border border-gray-400 text-[5.5px] flex items-center justify-center mb-[1.5px] text-gray-500 bg-white font-bold">${j}</div>`;
                }
                sidHTML += `</div>`;
            }
            document.getElementById('sheetStudentIdGrid').innerHTML = sidHTML;

            // ——— Version Bubbles ———
            const verContainer = document.getElementById('sheetVersionContainer');
            let verHTML = '';
            if (numSets > 1) {
                verContainer.classList.remove('hidden');
                for (let i = 0; i < numSets; i++) {
                    const letter = String.fromCharCode(65 + i);
                    verHTML += `<div class="w-[13px] h-[13px] rounded-full border border-gray-400 text-[7px] flex items-center justify-center mb-0.5 text-gray-600 bg-white font-bold">${letter}</div>`;
                }
            } else {
                verContainer.classList.add('hidden');
            }
            document.getElementById('sheetVersionBubbles').innerHTML = verHTML;

            // ——— Barcode ———
            let sheetType = cfg ? cfg.sheetType : 100;
            if (!cfg) {
                if (numQ <= 20) sheetType = 20;
                else if (numQ <= 50) sheetType = 50;
            }

            const barcodePatterns = {
                20: ['2mm', '6mm', '2mm', '2mm', '4mm', '2mm'],
                50: ['4mm', '2mm', '6mm', '2mm', '2mm', '4mm'],
                100: ['6mm', '2mm', '2mm', '4mm', '2mm', '6mm'],
            };
            let barcodeHTML = '';
            (barcodePatterns[sheetType] || barcodePatterns[100]).forEach(w => {
                barcodeHTML += `<div style="width:${w}; background:black;"></div>`;
            });
            document.getElementById('sheetBarcode').innerHTML = barcodeHTML;

            // ——— Bubbles Area ———
            const colClass = numQ <= 50 ? 'omr-columns-2' : 'omr-columns-4';
            let bubblesHTML = `<div class="${colClass} h-full">`;

            for (let i = 1; i <= numQ; i++) {
                bubblesHTML += `
                <div class="flex items-center gap-1 mb-[5px] break-inside-avoid">
                    <span class="w-[18px] text-right font-bold text-gray-800 text-[9px] shrink-0">${i}.</span>
                    <div class="flex gap-[3px]">`;

                for (let j = 0; j < numOpts; j++) {
                    const letter = String.fromCharCode(65 + j);
                    bubblesHTML += `<div class="w-[15px] h-[15px] rounded-full border border-gray-500 flex items-center justify-center text-[7px] text-gray-500 font-bold bg-white">${letter}</div>`;
                }

                bubblesHTML += `</div></div>`;
            }

            bubblesHTML += `</div>`;
            document.getElementById('sheetBubbles').innerHTML = bubblesHTML;
        }

        // ============================================================
        // รับ config จาก parent (index.html) ผ่าน postMessage
        // ============================================================
        window.addEventListener('message', function (e) {
            if (e.data && e.data.type === 'RENDER_SHEET') {
                const cfg = e.data.config;
                // ซ่อน toolbar เมื่อถูกเรียกจาก iframe
                if (cfg.hideToolbar) {
                    document.getElementById('sheetToolbar').style.display = 'none';
                    document.body.style.background = 'white';
                }
                renderSheet(cfg);
            }
        });

        // ——— ส่งสัญญาณว่า iframe โหลดเสร็จแล้ว ———
        if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'FRAME_READY' }, '*');
        }

        // ——— โหลดครั้งแรกอัตโนมัติ (กรณีเปิดไฟล์ตรง) ———
        renderSheet(null);
    </script>
</body>

</html>
