<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Exam Grading</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-slate-50 text-slate-800 font-sans antialiased">
  <div
    class="flex items-center justify-center min-h-screen bg-gradient-to-br from-blue-50 via-indigo-50 to-white relative overflow-hidden">
    <div class="absolute top-0 left-0 w-96 h-96 bg-blue-200 rounded-full mix-blend-multiply blur-3xl opacity-30"></div>
    <div class="absolute top-0 right-0 w-96 h-96 bg-indigo-200 rounded-full mix-blend-multiply blur-3xl opacity-30">
    </div>
    <div class="absolute -bottom-8 left-20 w-96 h-96 bg-purple-200 rounded-full mix-blend-multiply blur-3xl opacity-30">
    </div>

    <div
      class="bg-white/80 backdrop-blur-xl p-10 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white/50 w-full max-w-md relative z-10 overflow-hidden">
      <div class="text-center mb-8">
        <!-- Logo SVG -->
        <div class="flex justify-center mb-4">
          <div class="w-20 h-20 bg-white rounded-2xl flex items-center justify-center shadow-md border border-slate-100 overflow-hidden">
            <svg viewBox="0 0 100 100" class="w-16 h-16">
              <!-- Board -->
              <rect x="25" y="15" width="50" height="70" rx="6" fill="white" stroke="#1E293B" stroke-width="2" />
              <rect x="38" y="10" width="24" height="8" rx="2" fill="#475569" />
              <!-- Checkboxes -->
              <circle cx="38" cy="35" r="3" fill="#3B82F6" />
              <rect x="46" y="34" width="20" height="2" rx="1" fill="#E2E8F0" />
              <circle cx="38" cy="50" r="3" fill="#3B82F6" />
              <rect x="46" y="49" width="20" height="2" rx="1" fill="#E2E8F0" />
              <circle cx="38" cy="65" r="3" fill="#3B82F6" />
              <rect x="46" y="64" width="20" height="2" rx="1" fill="#E2E8F0" />
              <!-- Pencil -->
              <g transform="translate(68, 15) rotate(45)">
                <rect x="0" y="0" width="5" height="18" fill="#FBBF24" />
                <rect x="0" y="0" width="5" height="3.5" fill="#EF4444" />
                <path d="M0 18 L2.5 24 L5 18 Z" fill="#D1D5DB" />
              </g>
              <!-- Success Circle -->
              <circle cx="82" cy="82" r="14" fill="#10B981" stroke="white" stroke-width="1.5" />
              <path d="M76 82 L80 86 L88 78" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>
        </div>
        <h1 class="text-2xl font-extrabold text-gray-800 tracking-tight">ระบบตรวจและวิเคราะห์ข้อสอบ</h1>
        <p class="text-gray-500 mt-2 font-medium">ลงชื่อเข้าใช้งานระบบ</p>
      </div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-gray-700 text-sm font-bold mb-2">อีเมล (Email)</label>
          <input type="email" id="loginEmail"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="example@email.com" required>
        </div>
        <div>
          <div class="flex justify-between mb-2">
            <label class="block text-gray-700 text-sm font-bold">รหัสผ่าน (Password)</label>
            <button type="button" id="forgotPasswordBtn"
              class="text-blue-600 text-xs hover:underline">ลืมรหัสผ่าน?</button>
          </div>
          <input type="password" id="loginPassword"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="กรอกรหัสผ่าน" required>
        </div>
        <button type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-4 rounded-xl transition duration-200">
          เข้าสู่ระบบ
        </button>
      </form>

      <div class="mt-4">
        <button type="button" id="googleLoginBtn"
          class="w-full bg-white border border-slate-200 text-slate-700 font-semibold py-3 px-4 rounded-xl flex items-center justify-center hover:bg-slate-50 transition duration-200">
          <img src="https://img.icons8.com/color/24/000000/google-logo.png" class="mr-2 w-5 h-5"> เข้าสู่ระบบด้วย Google
        </button>
      </div>

      <div class="mt-8 text-center">
        <p class="text-slate-500 text-sm">ยังไม่มีบัญชี? <a href="register.html"
            class="text-blue-600 font-bold hover:underline">สมัครสมาชิกใหม่</a></p>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAMSxC9K4kZlNkZV3UyO4ZH206lancWW6g",
      authDomain: "examgradings.firebaseapp.com",
      projectId: "examgradings",
      storageBucket: "examgradings.firebasestorage.app",
      messagingSenderId: "185283559084",
      appId: "1:185283559084:web:1807f6434c8ca1efdfa909"
    };

    firebase.initializeApp(firebaseConfig);

    firebase.auth().onAuthStateChanged((user) => {
      if (user) {
        window.location.replace("dashboard.html");
      }
    });

    document.getElementById("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;

      Swal.fire({ title: "กำลังเข้าสู่ระบบ...", allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      try {
        await firebase.auth().signInWithEmailAndPassword(email, password);
        Swal.close();
      } catch (error) {
        Swal.fire("เข้าสู่ระบบไม่สำเร็จ", error.message, "error");
      }
    });

    document.getElementById("googleLoginBtn").addEventListener("click", async () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        await firebase.auth().signInWithPopup(provider);
      } catch (error) {
        if (error.code !== "auth/popup-closed-by-user" && error.code !== "auth/cancelled-popup-request") {
          Swal.fire("Login Error", error.message, "error");
        }
      }
    });

    document.getElementById("forgotPasswordBtn").addEventListener("click", async () => {
      const result = await Swal.fire({
        title: "รีเซ็ตรหัสผ่าน",
        input: "email",
        inputLabel: "กรอกอีเมลที่ใช้สมัคร",
        inputPlaceholder: "example@email.com",
        showCancelButton: true,
        confirmButtonText: "ส่งลิงก์รีเซ็ต"
      });
      if (!result.isConfirmed || !result.value) return;

      try {
        await firebase.auth().sendPasswordResetEmail(result.value);
        Swal.fire("สำเร็จ", "ส่งลิงก์รีเซ็ตรหัสผ่านแล้ว", "success");
      } catch (error) {
        Swal.fire("เกิดข้อผิดพลาด", error.message, "error");
      }
    });
  </script>
</body>

</html>
