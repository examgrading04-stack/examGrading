<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Exam Grading</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
  <div class="flex items-center justify-center min-h-screen bg-gradient-to-br from-blue-50 via-indigo-50 to-white relative overflow-hidden">
    <div class="bg-white/80 backdrop-blur-xl p-10 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white/50 w-full max-w-md relative z-10 overflow-hidden">
      <div class="text-center mb-8">
        <h1 class="text-2xl font-extrabold text-gray-800 tracking-tight">สร้างบัญชีผู้ใช้งาน</h1>
        <p class="text-gray-500 mt-2 font-medium">กรอกข้อมูลเพื่อเริ่มต้นใช้งานระบบ</p>
      </div>

      <form id="registerForm" class="space-y-4">
        <div>
          <label class="block text-gray-700 text-sm font-bold mb-2">อีเมล (Email)</label>
          <input type="email" id="regEmail" class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="example@email.com" required>
        </div>
        <div>
          <label class="block text-gray-700 text-sm font-bold mb-2">รหัสผ่าน (Password)</label>
          <input type="password" id="regPassword" class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="รหัสผ่านอย่างน้อย 6 ตัวอักษร" required>
        </div>
        <div>
          <label class="block text-gray-700 text-sm font-bold mb-2">ยืนยันรหัสผ่าน</label>
          <input type="password" id="regConfirmPassword" class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="ยืนยันรหัสผ่านอีกครั้ง" required>
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-4 rounded-xl transition duration-200">
          ลงทะเบียนสมาชิก
        </button>
      </form>

      <div class="mt-8 text-center">
        <p class="text-slate-500 text-sm">มีบัญชีอยู่แล้ว? <a href="login.html" class="text-blue-600 font-bold hover:underline">เข้าสู่ระบบ</a></p>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "examgradings.firebaseapp.com",
      projectId: "examgradings",
      storageBucket: "examgradings.firebasestorage.app",
      messagingSenderId: "185283559084",
      appId: "1:185283559084:web:1807f6434c8ca1efdfa909"
    };

    firebase.initializeApp(firebaseConfig);

    firebase.auth().onAuthStateChanged((user) => {
      if (user) {
        window.location.replace("dashboard.html");
      }
    });

    document.getElementById("registerForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = document.getElementById("regEmail").value;
      const password = document.getElementById("regPassword").value;
      const confirm = document.getElementById("regConfirmPassword").value;

      if (password !== confirm) {
        Swal.fire("รหัสผ่านไม่ตรงกัน", "กรุณาตรวจสอบรหัสผ่านอีกครั้ง", "error");
        return;
      }
      if (password.length < 6) {
        Swal.fire("รหัสผ่านสั้นเกินไป", "รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร", "error");
        return;
      }

      Swal.fire({ title: "กำลังสร้างบัญชี...", allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      try {
        await firebase.auth().createUserWithEmailAndPassword(email, password);
        Swal.fire("สำเร็จ", "สร้างบัญชีเรียบร้อยแล้ว กำลังเข้าสู่ระบบ...", "success");
      } catch (error) {
        Swal.fire("สมัครสมาชิกไม่สำเร็จ", error.message, "error");
      }
    });
  </script>
</body>
</html>
